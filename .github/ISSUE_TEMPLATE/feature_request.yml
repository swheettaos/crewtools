name: Feature request
description: A rule, a check, a setting or a change you'd like for hosting
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What happens in your games today, and what's in the way.
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Helping
      options:
        - label: I could send a pull request for this
